name: Fase 4.9 - señales rechazadas en sombra
on:
  push:
    branches:
      - bootiq-v3-auditoria
    paths:
      - 'estrategia.py'
      - 'auditoria_candidatas_sombra_practice.py'
      - 'tests/test_auditoria_candidatas_sombra_practice.py'
      - 'reporte_candidatas_sombra_practice.py'
      - 'tests/test_reporte_candidatas_sombra_practice.py'
      - 'tests/test_oportunidades_independientes_fase49.py'
      - 'experimento_alineacion_sombra_practice.py'
      - 'tests/test_experimento_alineacion_sombra_practice.py'
      - 'validacion_prospectiva_alineacion.py'
      - 'tests/test_validacion_prospectiva_alineacion.py'
      - 'diagnostico_causal_prospectivo.py'
      - 'tests/test_diagnostico_causal_prospectivo.py'
      - 'trazabilidad_rondas_sombra.py'
      - 'auditar_trazabilidad_sombra.py'
      - 'bot.py'
      - 'tests/test_trazabilidad_rondas_sombra.py'
      - 'validacion_choch_soporte_congelada.py'
      - 'tests/test_validacion_choch_soporte_congelada.py'
      - 'diagnostico_cierre_sombra.py'
      - 'tests/test_diagnostico_cierre_sombra.py'
      - '.github/workflows/fase49-sombra-candidatas.yml'
  workflow_dispatch:
jobs:
  diagnostico-sombra:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis
        run: python -m py_compile auditoria_candidatas_sombra_practice.py reporte_candidatas_sombra_practice.py experimento_alineacion_sombra_practice.py validacion_prospectiva_alineacion.py diagnostico_causal_prospectivo.py trazabilidad_rondas_sombra.py auditar_trazabilidad_sombra.py validacion_choch_soporte_congelada.py diagnostico_cierre_sombra.py estrategia.py bot.py
      - name: Regression shadow ledger sin broker
        run: python -m unittest discover -s tests -p 'test_auditoria_candidatas_sombra_practice.py' -v
      - name: Regression reporte por estrategia y contexto
        run: python -m unittest discover -s tests -p 'test_reporte_candidatas_sombra_practice.py' -v
      - name: Regression independencia de oportunidades
        run: python -m unittest discover -s tests -p 'test_oportunidades_independientes_fase49.py' -v
      - name: Regression comparador experimental de alineacion
        run: python -m unittest discover -s tests -p 'test_experimento_alineacion_sombra_practice.py' -v
      - name: Regression corte prospectivo fijado
        run: python -m unittest discover -s tests -p 'test_validacion_prospectiva_alineacion.py' -v
      - name: Regression diagnostico aislado posterior al corte
        run: python -m unittest discover -s tests -p 'test_diagnostico_causal_prospectivo.py' -v
      - name: Regression trazabilidad de intentos en sombra
        run: python -m unittest discover -s tests -p 'test_trazabilidad_rondas_sombra.py' -v
      - name: Regression corte congelado CHOCH soporte sin broker
        run: python -m unittest discover -s tests -p 'test_validacion_choch_soporte_congelada.py' -v
      - name: Regression diagnostico de cierres sin broker
        run: python -m unittest discover -s tests -p 'test_diagnostico_cierre_sombra.py' -v
