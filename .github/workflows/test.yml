name: Test

on: 
  pull_request: {}
  push:
    branches: master
    tags: "*"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - uses: actions/cache@v4
        id: cache-it
        with:
          path: |
            .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('**/Pipfile') }}
          restore-keys: |
            ${{ runner.os }}-venv

      - name: Install pipenv
        run: |
          pip install pipenv

      - name: Install dependencies
        if: steps.cache-it.outputs.cache-hit != 'true'
        run: pipenv install --deploy --dev

      - name: Install offline backtest dependencies for OOS replay
        run: pipenv run pip install "pandas>=1.5,<3" "numpy>=1.23,<2"

      - name: Audit contextual tests (no broker, no REAL)
        run: |
          pipenv run python ci_run_broker_free.py \
            tests.test_cierre_monitor_sombra \
            tests.test_monitor_pausas_contextuales \
            tests.test_auditoria_vetos_cerebro \
            tests.test_auditoria_contextual_operaciones \
            tests.test_auditoria_historial_contextual \
            tests.test_core4_selective_diagnostic \
            tests.test_v3_authority_diagnostic \
            tests.test_auditoria_autoridad_cerebro \
            tests.test_riesgo_base_provisional \
            tests.test_auditoria_diversidad_temporal \
            tests.test_auditoria_cobertura_estabilidad \
            tests.test_auditoria_calibracion_sombra \
            tests.test_auditoria_generalizacion_fuentes \
            tests.test_auditoria_transferencia_temporal \
            tests.test_auditoria_calibracion_walkforward \
            tests.test_oos_oct02_replay \
            tests.test_partial_official_top \
            tests.test_reconnection_backoff \
            tests.test_entry_timing_and_websocket_timeout \
            tests.test_cache_bootstrap_recovery \
            tests.test_heartbeat_forwarding \
            tests.test_auditoria_causas_cancelacion \
            tests.test_auditoria_factores_cerebro \
            tests.test_auditoria_calidad_frecuencia_cerebro \
            tests.test_auditoria_rutas_core4_frecuencia \
            tests.test_auditoria_evidencia_core4_multiventana \
            tests.test_auditoria_transferencia_estrategias_multiventana \
            tests.test_auditoria_hipotesis_fase32 \
            tests.test_auditoria_economia_fase32 \
            tests.test_auditoria_generalizacion_fase32 \
            tests.test_auditoria_intervalo_cerebro_fase3 \
            tests.test_auditoria_familias_fase3 \
            tests.test_auditar_fase3_prospectiva_offline \
            tests.test_capturar_fase3_velas_practice

