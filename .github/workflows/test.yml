name: Test

on: 
  pull_request: {}
  push:
    branches: master
    tags: "*"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.9

      - uses: actions/cache@v4
        id: cache-it
        with:
          path: |
            .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('**/Pipefile') }}
          restore-keys: |
            ${{ runner.os }}-venv

      - name: Install pipenv
        run: |
          pip install pipenv

      - name: Install dependencies
        if: steps.cache-it.outputs.cache-hit != 'true'
        run: pipenv install --deploy --dev

      - name: Audit contextual tests (no broker, no REAL)
        run: |
          pipenv run python -m unittest \
            tests.test_cierre_monitor_sombra \
            tests.test_monitor_pausas_contextuales \
            tests.test_auditoria_vetos_cerebro \
            tests.test_auditoria_contextual_operaciones \
            tests.test_auditoria_historial_contextual \
            tests.test_core4_selective_diagnostic \
            tests.test_v3_authority_diagnostic \
            tests.test_auditoria_autoridad_cerebro \
            tests.test_riesgo_base_provisional \
            tests.test_auditoria_diversidad_temporal \
            tests.test_auditoria_cobertura_estabilidad \
            tests.test_auditoria_calibracion_sombra \
            tests.test_auditoria_generalizacion_fuentes \
            tests.test_oos_oct02_replay

