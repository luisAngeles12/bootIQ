name: Reset - verifica base limpia

on:
  push:
    branches:
      - reset/bootiq-base-limpia-20261027
  pull_request: {}

jobs:
  comprobaciones_sin_broker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Verificar ausencia de historial y sintaxis PRACTICE
        run: python ci_validar_reset.py
