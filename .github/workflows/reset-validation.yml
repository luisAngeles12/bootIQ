name: Reset - verifica base limpia

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  comprobaciones_sin_broker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Verificar ausencia de historial y sintaxis PRACTICE
        run: python ci_validar_reset.py
      - name: Instalar dependencias mínimas sin acceso al bróker
        run: python -m pip install requests websocket-client==0.56 pandas==2.0.3 numpy==1.26.4
      - name: Importar bot y backtest sin credenciales ni datos
        run: python ci_smoke_runtime.py
      - name: Probar RSI de Wilder y mercado plano
        run: python -m unittest discover -s tests -p test_rsi_wilder.py -v
      - name: Probar arranque sin memoria estadística anterior
        run: python -m unittest discover -s tests -p test_cold_start_reset.py -v
      - name: Probar microrechazos con velas de un segundo
        run: python -m unittest discover -s tests -p test_micro_rechazo_1s.py -v
