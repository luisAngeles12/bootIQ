name: Practice auditor validation

on:
  push:
    branches: [bootiq-v3-auditoria]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Syntax check (offline)
        run: |
          python -m py_compile auditar_paridad_decisiones_practice.py tests/test_auditar_paridad_decisiones_practice.py auditar_consistencia_20_practice.py tests/test_consistencia_20_practice.py
      - name: Causal auditor regression (offline, no broker)
        run: |
          python -m unittest discover -s tests -p 'test_auditar_paridad_decisiones_practice.py' -v
      - name: Practice consistency and bootstrap segregation (offline)
        run: |
          python -m unittest discover -s tests -p 'test_consistencia_20_practice.py' -v
      - name: Prospective rounds 3-4 x 20 (offline, synthetic regressions)
        run: |
          python -m py_compile validar_rondas_60_practice.py tests/test_validar_rondas_60_practice.py
          python -m unittest discover -s tests -p 'test_validar_rondas_60_practice.py' -v
      - name: Pattern stability by authority (offline, synthetic regressions)
        run: |
          python -m py_compile investigar_patrones_practice.py tests/test_investigar_patrones_practice.py
          python -m unittest discover -s tests -p 'test_investigar_patrones_practice.py' -v
      - name: Shadow day robustness and correlation (offline)
        run: |
          python -m py_compile experimento_alineacion_sombra_practice.py tests/test_experimento_alineacion_sombra_practice.py
          python -m unittest discover -s tests -p 'test_experimento_alineacion_sombra_practice.py' -v
      - name: Shadow chronological interactions (offline)
        run: |
          python -m py_compile analizar_interacciones_sombra_practice.py tests/test_analizar_interacciones_sombra_practice.py
          python -m unittest discover -s tests -p 'test_analizar_interacciones_sombra_practice.py' -v
