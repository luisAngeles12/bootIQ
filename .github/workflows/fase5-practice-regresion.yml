name: BootIQ fase 5 - regresion PRACTICE aislada

on:
  push:
    branches:
      - bootiq-v3-auditoria
    paths:
      - 'historial.py'
      - 'estrategia.py'
      - 'operaciones.py'
      - 'comparar_confluencia_indicadores_fase5_practice.py'
      - 'tests/test_comparar_confluencia_indicadores_fase5_practice.py'
      - 'tests/test_fase5_persistencia_indicadores.py'
      - '.github/workflows/fase5-practice-regresion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regresion-aislada:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencia de persistencia
        run: python -m pip install 'pandas>=2,<3'
      - name: Verificar sintaxis sin importar bot
        run: |
          python -m py_compile historial.py estrategia.py operaciones.py comparar_confluencia_indicadores_fase5_practice.py
      - name: Ejecutar regresiones PRACTICE sin broker
        run: |
          python -m unittest discover -s tests -p 'test_comparar_confluencia_indicadores_fase5_practice.py' -v
          python -m unittest discover -s tests -p 'test_fase5_persistencia_indicadores.py' -v
