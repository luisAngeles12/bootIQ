name: Fase 5 - diagnostico PRACTICE sin broker

on:
  push:
    branches: [bootiq-v3-auditoria]
    paths:
      - 'auditar_consistencia_20_practice.py'
      - 'experimentos_fase5_practice.py'
      - 'diagnostico_pa_riesgo_practice.py'
      - 'reporte_fase5_practice.py'
      - 'auditar_memoria_fase5_practice.py'
      - 'verificar_particion_train_valid_practice.py'
      - 'construir_memoria_train_candidata_practice.py'
      - 'preparar_particion_cronologica_fase5_practice.py'
      - 'evaluar_memoria_candidata_oos_practice.py'
      - 'tests/test_consistencia_20_practice.py'
      - 'tests/test_experimentos_fase5_practice.py'
      - 'tests/test_diagnostico_pa_riesgo_practice.py'
      - 'tests/test_reporte_fase5_practice.py'
      - 'tests/test_auditar_memoria_fase5_practice.py'
      - 'tests/test_particion_train_valid_practice.py'
      - 'tests/test_memoria_train_candidata_practice.py'
      - 'tests/test_particion_cronologica_fase5_practice.py'
      - 'tests/test_evaluar_memoria_candidata_oos_practice.py'
      - '.github/workflows/fase5-diagnostico-practice.yml'
  pull_request:
    paths:
      - 'auditar_consistencia_20_practice.py'
      - 'experimentos_fase5_practice.py'
      - 'diagnostico_pa_riesgo_practice.py'
      - 'reporte_fase5_practice.py'
      - 'auditar_memoria_fase5_practice.py'
      - 'verificar_particion_train_valid_practice.py'
      - 'construir_memoria_train_candidata_practice.py'
      - 'preparar_particion_cronologica_fase5_practice.py'
      - 'evaluar_memoria_candidata_oos_practice.py'
      - 'tests/test_consistencia_20_practice.py'
      - 'tests/test_experimentos_fase5_practice.py'
      - 'tests/test_diagnostico_pa_riesgo_practice.py'
      - 'tests/test_reporte_fase5_practice.py'
      - 'tests/test_auditar_memoria_fase5_practice.py'
      - 'tests/test_particion_train_valid_practice.py'
      - 'tests/test_memoria_train_candidata_practice.py'
      - 'tests/test_particion_cronologica_fase5_practice.py'
      - 'tests/test_evaluar_memoria_candidata_oos_practice.py'
      - '.github/workflows/fase5-diagnostico-practice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-estadisticos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Ejecutar pruebas sin conectar a IQ Option
        run: |
          python -m unittest discover -s tests -p 'test_consistencia_20_practice.py' -v
          python -m unittest discover -s tests -p 'test_experimentos_fase5_practice.py' -v
          python -m unittest discover -s tests -p 'test_diagnostico_pa_riesgo_practice.py' -v
          python -m unittest discover -s tests -p 'test_reporte_fase5_practice.py' -v
          python -m unittest discover -s tests -p 'test_auditar_memoria_fase5_practice.py' -v
          python -m unittest discover -s tests -p 'test_particion_train_valid_practice.py' -v
          python -m unittest discover -s tests -p 'test_memoria_train_candidata_practice.py' -v
          python -m unittest discover -s tests -p 'test_particion_cronologica_fase5_practice.py' -v
          python -m unittest discover -s tests -p 'test_evaluar_memoria_candidata_oos_practice.py' -v
