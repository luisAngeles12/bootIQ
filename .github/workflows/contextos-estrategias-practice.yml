name: BootIQ contexto de estrategias - regresion PRACTICE
on:
  push:
    branches: [bootiq-v3-auditoria]
    paths:
      - 'analizar_oportunidades_integrales_practice.py'
      - 'evaluar_combinaciones_contexto_practice.py'
      - 'diagnosticar_uso_memoria_v3_practice.py'
      - 'diagnosticar_cobertura_real_v3_practice.py'
      - 'motor_aprendizaje_historico.py'
      - 'reporte_fase5_practice.py'
      - 'tests/test_analizar_oportunidades_integrales_practice.py'
      - 'tests/test_evaluar_combinaciones_contexto_practice.py'
      - 'tests/test_diagnosticar_uso_memoria_v3_practice.py'
      - 'tests/test_diagnosticar_cobertura_real_v3_practice.py'
      - '.github/workflows/contextos-estrategias-practice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contextual-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar sintaxis
        run: python -m py_compile analizar_oportunidades_integrales_practice.py evaluar_combinaciones_contexto_practice.py diagnosticar_uso_memoria_v3_practice.py diagnosticar_cobertura_real_v3_practice.py reporte_fase5_practice.py
      - name: Pruebas aisladas sin broker
        run: |
          python -m unittest discover -s tests -p 'test_analizar_oportunidades_integrales_practice.py' -v
          python -m unittest discover -s tests -p 'test_evaluar_combinaciones_contexto_practice.py' -v
          python -m unittest discover -s tests -p 'test_diagnosticar_uso_memoria_v3_practice.py' -v
          python -m unittest discover -s tests -p 'test_diagnosticar_cobertura_real_v3_practice.py' -v
