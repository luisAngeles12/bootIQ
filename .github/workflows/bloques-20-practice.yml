name: BootIQ - bloques de 20 operaciones PRACTICE
on:
  push:
    branches: [bootiq-v3-auditoria]
    paths:
      - 'control_bloques_20_practice.py'
      - 'bootstrap_practice.py'
      - 'decision_bootiq.py'
      - 'constructor_evidencia.py'
      - 'comparar_bloques_20_practice.py'
      - 'auditar_entradas_bloque20_practice.py'
      - 'bot.py'
      - 'operaciones.py'
      - 'config.py'
      - 'tests/test_control_bloques_20_practice.py'
      - 'tests/test_bootstrap_practice.py'
      - 'tests/test_integracion_bootstrap_memoria_fase8.py'
      - 'tests/test_bootstrap_price_action_context.py'
      - 'price_action.py'
      - 'estrategia.py'
      - 'motor_estrategias.py'
      - 'tests/test_patron_contexto_puntaje_practice.py'
      - 'tests/test_paridad_pre_buy_practice.py'
      - 'tests/test_price_action_fallo_cerrado_practice.py'
      - 'tests/test_auditoria_precio_iq_practice.py'
      - 'tests/test_persistencia_precio_iq_practice.py'
      - 'auditoria_precio_iq_practice.py'
      - 'auditar_entradas_bloque20_practice.py'
      - 'historial.py'
      - 'tests/test_comparar_bloques_20_practice.py'
      - 'tests/test_auditar_entradas_bloque20_practice.py'
      - '.github/workflows/bloques-20-practice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bloque20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis de codigo operativo
        run: python -m py_compile control_bloques_20_practice.py comparar_bloques_20_practice.py auditar_entradas_bloque20_practice.py auditoria_precio_iq_practice.py bootstrap_practice.py decision_bootiq.py constructor_evidencia.py price_action.py estrategia.py motor_estrategias.py bot.py operaciones.py config.py
      - name: Crear stub local de configuracion sin credenciales reales
        run: |
          echo 'EMAIL = "CI_NO_LOGIN"' > credenciales_local.py
          echo 'PASSWORD = "CI_NO_LOGIN"' >> credenciales_local.py
      - name: Ejecutar pruebas sin broker ni credenciales
        run: |
          python -m unittest discover -s tests -p 'test_control_bloques_20_practice.py' -v
          python -m unittest discover -s tests -p 'test_bootstrap_practice.py' -v
          python -m unittest discover -s tests -p 'test_integracion_bootstrap_memoria_fase8.py' -v
          python -m unittest discover -s tests -p 'test_bootstrap_price_action_context.py' -v
          python -m unittest discover -s tests -p 'test_patron_contexto_puntaje_practice.py' -v
          python -m unittest discover -s tests -p 'test_paridad_pre_buy_practice.py' -v
          python -m unittest discover -s tests -p 'test_price_action_fallo_cerrado_practice.py' -v
          python -m unittest discover -s tests -p 'test_auditoria_precio_iq_practice.py' -v
          python -m unittest discover -s tests -p 'test_persistencia_precio_iq_practice.py' -v
          python -m unittest discover -s tests -p 'test_comparar_bloques_20_practice.py' -v
          python -m unittest discover -s tests -p 'test_auditar_entradas_bloque20_practice.py' -v
